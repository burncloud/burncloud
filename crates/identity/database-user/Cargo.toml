[package]
publish.workspace = true
license.workspace = true
name = "burncloud-database-user"
version = "0.1.0"
edition = "2021"

[dependencies]
burncloud-database.workspace = true
sqlx.workspace = true
serde.workspace = true
tracing.workspace = true
rand = { workspace = true, features = ["std_rng"] }

[dev-dependencies]
serde_json.workspace = true
# Only the integration test needs an async runtime; `src/` has no tokio use.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# `UserDatabase::init` still contains compatibility ALTERs in the crate root.
# Mirror the workspace policy and scope only the measured legacy init debt here;
# all correctness gates remain identical to the workspace.
[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
disallowed_types = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "warn"
panic_in_result_fn = "warn"
allow_attributes_without_reason = "warn"
too_many_arguments = "warn"
large_futures = "warn"
wildcard_imports = "warn"
undocumented_unsafe_blocks = "warn"

# Existing, measured debt from the 2026-10-05 workspace Clippy run. The ignored
# ALTER errors are the legacy "duplicate column" compatibility path; replace
# them with explicit schema inspection before removing this baseline.
let_underscore_must_use = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
