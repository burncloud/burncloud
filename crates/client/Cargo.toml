[package]
publish.workspace = true
name = "burncloud-client"
version = "0.2.0"
edition = "2021"
description = "Dioxus client for the BurnCloud AI routing platform"
license = "MIT"
repository = "https://github.com/burncloud/burncloud"
authors = ["burncloud contributors"]

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
liveview = ["dep:dioxus-liveview", "dep:axum", "dep:burncloud-database"]

[dependencies]
burncloud-common.workspace = true
dioxus = { workspace = true, features = ["router"] }
dioxus-router.workspace = true
tokio.workspace = true

# LiveView integration used by the BurnCloud server binary.
dioxus-liveview = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
burncloud-database = { workspace = true, optional = true }

[build-dependencies]
winres = "0.1"

[lints]
workspace = true
