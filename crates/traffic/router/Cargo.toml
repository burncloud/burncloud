[package]
publish.workspace = true
license.workspace = true
name = "burncloud-router"
version = "0.1.0"
edition = "2021"

[features]
exchange-api = []

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["stream", "json"] }
anyhow = { workspace = true }
http-body-util.workspace = true
serde_json = { workspace = true }
dashmap.workspace = true
log = { workspace = true }

burncloud-database = { workspace = true }
burncloud-database-router = { workspace = true }
burncloud-database-billing = { workspace = true }
burncloud-database-channel = { workspace = true }
burncloud-commerce-contracts = { workspace = true }
burncloud-supply-contracts = { workspace = true }
burncloud-traffic-contracts = { workspace = true }
burncloud-common = { workspace = true }
burncloud-service-billing = { workspace = true }
burncloud-service-user = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
jsonwebtoken = { workspace = true }
once_cell = { workspace = true }
chrono = { workspace = true }

axum = { workspace = true, features = ["macros"] }
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
regex.workspace = true

[dev-dependencies]
base64 = { workspace = true }
mockito.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
# Lets a test turn on the router's own `tracing` output. Without it a test can only observe a path's side
# effects, so a path that fails before its side effect is invisible — which is what made the settlement defect
# look like a fixture problem. Off unless a run sets `RUST_LOG`.
tracing-subscriber.workspace = true

[[example]]
name = "configure_apikey_test"
path = "examples/configure_apikey_test.rs"

[lints]
workspace = true
