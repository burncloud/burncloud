[package]
publish.workspace = true
license.workspace = true
name = "burncloud-service-router-log"
version = "0.1.0"
edition = "2021"

[dependencies]
burncloud-database-router.workspace = true
burncloud-database.workspace = true

# Only `tokio` is needed for the tests. The SQL goes through `burncloud_database::sqlx`, which that crate
# re-exports, so `sqlx` is deliberately not a direct dependency here; `tempfile` is likewise unnecessary, since
# the tests create their databases under the temp directory and remove them and their WAL companions themselves.
[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
