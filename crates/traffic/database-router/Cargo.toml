[package]
publish.workspace = true
license.workspace = true
name = "burncloud-database-router"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait.workspace = true
burncloud-common.workspace = true
burncloud-database.workspace = true
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
aes-gcm.workspace = true
hex.workspace = true
rand.workspace = true
md5.workspace = true

[dev-dependencies]
chrono = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# This crate has warning sites in its crate root, so they cannot be scoped from
# a parent module with `#[expect]`. Mirror the workspace policy here and allow
# only the historical warnings measured by the strict-Clippy cleanup. Remove
# these exceptions as the corresponding migrations/log helpers are decomposed.
[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
disallowed_types = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "warn"
panic_in_result_fn = "warn"
large_futures = "warn"
wildcard_imports = "warn"
undocumented_unsafe_blocks = "warn"

# Existing, measured debt from the 2026-10-05 workspace Clippy run.
let_underscore_must_use = "allow"
allow_attributes_without_reason = "allow"
type_complexity = "allow"
too_many_lines = "allow"
should_implement_trait = "allow"
too_many_arguments = "warn"
cognitive_complexity = "warn"
