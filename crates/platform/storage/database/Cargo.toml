[package]
publish.workspace = true
name = "burncloud-database"
version = "0.1.0"
edition = "2021"
authors = ["BurnCloud Team <team@burncloud.com>"]
description = "Core database abstractions and traits for BurnCloud AI management system"
documentation = "https://docs.rs/burncloud-database"
homepage = "https://github.com/burncloud/burncloud-database"
repository = "https://github.com/burncloud/burncloud-database"
license = "MIT OR Apache-2.0"
keywords = ["database", "ai", "model-management", "burncloud", "async"]
categories = ["database", "api-bindings", "development-tools"]
readme = "README.md"

[dependencies]
sqlx = { workspace = true, features = ["postgres", "sqlite"] }
tokio.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
dirs.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only, to prove Platform writes no domain default records itself (#842): the boundary
# contract asserts that `create_database_with_url` seeds nothing, and that the owner
# capabilities produce the historical (1 user, 1 key, 4 protocol configs) result when the
# application bootstrap calls them. Neither owner depends on this crate at runtime, so these
# edges cannot form a cycle. Platform's own source must never import them.
burncloud-identity-user.workspace = true
burncloud-supply-channel.workspace = true

[[example]]
name = "database-basic-usage"
path = "examples/basic_usage.rs"

[[example]]
name = "default_location"
path = "examples/default_location.rs"

[lints]
workspace = true
