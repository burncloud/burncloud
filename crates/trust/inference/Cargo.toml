[package]
publish.workspace = true
license.workspace = true
name = "burncloud-service-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true, features = ["process", "io-util", "time"] }
thiserror = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
burncloud-supply-contracts = { workspace = true }
burncloud-database = { workspace = true }
burncloud-supply-channel = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
burncloud-router.workspace = true
anyhow = { workspace = true }
# Test-only: the crate itself needs tokio's process/io-util/time features only, while the
# integration tests under tests/ need the test attribute and a multi-threaded runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
