[workspace]
members = [
    "crates/interfaces/common",
    "crates/identity/token",
    "crates/identity/user",
    "crates/traffic/contracts",
    "crates/supply/contracts",
    "crates/supply/channel",
    "crates/supply/model",
    "crates/traffic/router",
    "crates/traffic/router-aws",
    "crates/commerce/contracts",
    "crates/commerce/billing",
    "crates/trust/inference",
    "crates/platform/configuration/setting",
    "crates/platform/lifecycle/installer",
    "crates/platform/lifecycle/loops",
    "crates/platform/lifecycle/update",
    "crates/platform/node",
    "crates/platform/code",
    "crates/platform/observability/ip",
    "crates/platform/observability/monitor",
    "crates/platform/storage/database",
    "crates/platform/storage/database-sys",
    "crates/platform/storage/download",
    "crates/platform/storage/download-aria2",
    "crates/interfaces/client",
    "crates/interfaces/server",
    "crates/interfaces/service",
    "crates/interfaces/tests",
]

[workspace.package]
license = "MIT"
publish = false

# -----------------------------------------------------------------------------
# Repository-wide compiler and Clippy policy
# -----------------------------------------------------------------------------
#
# Hard errors are reserved for behavior that lets an agent hide failures or
# create correctness hazards. Existing style/complexity debt remains warnings so
# tightening the policy never becomes an excuse for unrelated refactors.

[workspace.lints.rust]
# Do not allow visually-confusable identifiers in code written by humans/agents.
non_ascii_idents = "deny"

# Unsafe functions must still make each unsafe operation explicit.
unsafe_op_in_unsafe_fn = "deny"

# Results/Futures annotated as must_use may not be silently discarded.
unused_must_use = "deny"

# Surface accidental public APIs without breaking historical code immediately.
unreachable_pub = "warn"

[workspace.lints.clippy]
# Existing hard gates.
unwrap_used = "deny"
disallowed_types = "deny"

# Agent escape hatches: unfinished/debug code may not enter production crates.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Async/must-use correctness hazards.
let_underscore_future = "deny"
# Historical storage migrations contain explicit best-effort `let _ = Result`
# paths. Keep them visible until #629 classifies/removes them, then promote this
# lint back to `deny`.
let_underscore_must_use = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# Historical production debt exists for expect()/panic paths. Keep them visible
# without expanding this policy PR into behavioral refactoring.
expect_used = "warn"
panic_in_result_fn = "warn"

# Any lint suppression added by an agent should carry an explicit justification.
allow_attributes_without_reason = "warn"

# Maintainability budgets. Thresholds live in clippy.toml and remain warnings
# until the current codebase is clean enough to promote them to hard gates.
too_many_arguments = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
large_futures = "warn"
wildcard_imports = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
anyhow = "1.0"
dotenvy = "0.15"
log = "0.4"
semver = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# UI Framework
dioxus = { version = "0.7.2", default-features = false }
dioxus-router = "0.7.2"
dioxus-liveview = { version = "0.7.2", features = ["axum"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "any", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }

# Utilities
async-trait = "0.1"
base64 = "0.22"
dirs = "5.0"
tempfile = "3.8"
futures = "0.3"
futures-util = "0.3"
regex = "1"
once_cell = "1.19"
dashmap = "5.5"
time = "0.3"
hex = "0.4"
url = "2.5"
rand = "0.8"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.8.7", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }
http-body-util = "0.1"
http = "1.0"

# Cryptography
sha2 = "0.10"
md5 = "0.7"
hmac = "0.12"
jsonwebtoken = "9.3"
bcrypt = "0.17.1"
aes-gcm = "0.10"

# Archive
zip = "0.6"

# Testing
tokio-test = "0.4"
mockito = "1.7"

# System
libc = "0.2"
winapi = { version = "0.3", features = ["winuser", "pdh", "psapi", "winbase", "winnt", "fileapi", "handleapi", "winerror", "sysinfoapi", "winreg"] }

# UI
dioxus-desktop = "0.7.2"
dioxus-ssr = "0.7.2"

# Build
winres = "0.1"
image = "0.25"

# Application
self_update = { version = "1.3.0", features = ["archive-zip"] }
systray = "0.4.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"

# Internal crates
burncloud-code = { path = "crates/platform/code" }
burncloud-auto-update = { path = "crates/platform/lifecycle/update" }
burncloud-client = { path = "crates/interfaces/client", default-features = false }
burncloud-commerce-contracts = { path = "crates/commerce/contracts" }
burncloud-common = { path = "crates/interfaces/common" }
burncloud-database = { path = "crates/platform/storage/database" }
burncloud-commerce-billing = { path = "crates/commerce/billing" }
burncloud-database-sys = { path = "crates/platform/storage/database-sys" }
burncloud-download = { path = "crates/platform/storage/download" }
burncloud-download-aria2 = { path = "crates/platform/storage/download-aria2" }
burncloud-installer = { path = "crates/platform/lifecycle/installer" }
burncloud-node-runtime = { path = "crates/platform/node" }
burncloud-router = { path = "crates/traffic/router" }
burncloud-router-aws = { path = "crates/traffic/router-aws" }
burncloud-server = { path = "crates/interfaces/server" }
burncloud-service = { path = "crates/interfaces/service" }
burncloud-service-ip = { path = "crates/platform/observability/ip" }
burncloud-service-monitor = { path = "crates/platform/observability/monitor" }
burncloud-service-setting = { path = "crates/platform/configuration/setting" }
burncloud-service-inference = { path = "crates/trust/inference" }
burncloud-identity-user = { path = "crates/identity/user" }
burncloud-identity-token = { path = "crates/identity/token" }
burncloud-supply-channel = { path = "crates/supply/channel" }
burncloud-supply-model = { path = "crates/supply/model" }
burncloud-supply-contracts = { path = "crates/supply/contracts" }
burncloud-traffic-contracts = { path = "crates/traffic/contracts" }

[package]
name = "burncloud"
version = "0.1.17"
edition = "2021"
description = "A cross-platform file sharing and synchronization tool"
license = "MIT"
repository = "https://github.com/burncloud/burncloud"
homepage = "https://github.com/burncloud/burncloud"
authors = ["burncloud contributors"]
keywords = ["file-sharing", "sync", "cloud", "p2p"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = []

[[bin]]
name = "burncloud"
path = "crates/interfaces/cli/src/main.rs"

[dependencies]
burncloud-code.workspace = true
burncloud-commerce-contracts.workspace = true
burncloud-common.workspace = true
burncloud-supply-contracts.workspace = true
burncloud-server.workspace = true
burncloud-client = { workspace = true, default-features = false, features = ["liveview"] }

tokio.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
rand.workspace = true
hex.workspace = true

burncloud-auto-update.workspace = true
burncloud-database.workspace = true
burncloud-commerce-billing.workspace = true
burncloud-supply-channel.workspace = true
burncloud-router.workspace = true
burncloud-database-sys.workspace = true
burncloud-identity-user.workspace = true
burncloud-installer.workspace = true
bcrypt.workspace = true
uuid.workspace = true
clap.workspace = true
tracing.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
chrono.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
burncloud-client = { workspace = true, default-features = false, features = ["desktop"] }

[lints]
workspace = true
