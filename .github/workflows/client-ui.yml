name: Client UI Conventions

on:
  pull_request:
    paths:
      - 'crates/client/**'
      - 'docs/ui/**'
      - '.github/workflows/client-ui.yml'

permissions:
  contents: read

jobs:
  ui-conventions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check console button conventions
        run: bash scripts/check-ui-conventions.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check Dioxus LiveView client
        run: cargo check --no-default-features --features liveview
