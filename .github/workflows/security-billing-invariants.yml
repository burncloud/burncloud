name: Security & Billing Invariants

on:
  pull_request:
    paths:
      - "crates/server/**"
      - "crates/router/**"
      - "crates/database/crates/router/**"
      - "crates/service/crates/router-log/**"
      - ".github/workflows/security-billing-invariants.yml"
  push:
    branches: [main]
    paths:
      - "crates/server/**"
      - "crates/router/**"
      - "crates/database/crates/router/**"
      - "crates/service/crates/router-log/**"
      - ".github/workflows/security-billing-invariants.yml"

permissions:
  contents: read

jobs:
  invariants:
    name: Security + Billing invariant suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Capture rustfmt diagnostic
        id: formatting
        shell: bash
        run: |
          set +e
          cargo fmt > /tmp/rustfmt.log 2>&1
          fmt_status=$?
          set -e
          git diff --binary > /tmp/rustfmt.patch
          if [ -s /tmp/rustfmt.patch ]; then
            has_diff=1
          else
            has_diff=0
          fi
          echo "fmt_status=$fmt_status" >> "$GITHUB_OUTPUT"
          echo "has_diff=$has_diff" >> "$GITHUB_OUTPUT"
          cat /tmp/rustfmt.log
          if [ "$has_diff" = "1" ]; then
            echo "rustfmt changed these files:"
            git diff --name-only
          fi

      - name: Upload rustfmt diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diagnostic
          path: |
            /tmp/rustfmt.log
            /tmp/rustfmt.patch
          if-no-files-found: error

      - name: Enforce formatting
        if: steps.formatting.outputs.fmt_status != '0' || steps.formatting.outputs.has_diff != '0'
        run: exit 1

      - name: Check affected packages
        run: cargo check -p burncloud-router -p burncloud-server

      - name: Billing invariants
        run: cargo test -p burncloud-router --test billing_invariants --test quota_tests

      - name: Security invariants
        run: cargo test -p burncloud-server --test security_invariants
