name: Security & Billing Invariants

on:
  pull_request:
    paths:
      - "crates/interfaces/server/**"
      - "crates/traffic/router/**"
      - "crates/platform/node/**"
      - "crates/platform/storage/database/src/**"
      - "crates/traffic/database-router/**"
      - "crates/traffic/service-router-log/**"
      # Domain contracts and the Interfaces compatibility layer: these hold the type definitions
      # every other crate consumes, so a change here needs the contract tests to run.
      - "crates/commerce/contracts/**"
      - "crates/supply/contracts/**"
      - "crates/traffic/contracts/**"
      - "crates/interfaces/common/**"
      # Persistence adapters for Commerce and Supply, including their real-SQLite tests.
      - "crates/commerce/database-billing/**"
      - "crates/supply/database-channel/**"
      - "crates/identity/database-user/**"
      # Identity owns the credential and identity facts. `service-token` carries the validation,
      # quota-settlement and rotation rules, and `service-user` the registration, login and JWT
      # rules; both use isolated temporary SQLite files, so they run without any service.
      - "crates/identity/service-token/**"
      - "crates/identity/service-user/**"
      - ".github/workflows/security-billing-invariants.yml"
  push:
    branches: [main]
    paths:
      - "crates/interfaces/server/**"
      - "crates/traffic/router/**"
      - "crates/platform/node/**"
      - "crates/platform/storage/database/src/**"
      - "crates/traffic/database-router/**"
      - "crates/traffic/service-router-log/**"
      - "crates/commerce/contracts/**"
      - "crates/supply/contracts/**"
      - "crates/traffic/contracts/**"
      - "crates/interfaces/common/**"
      - "crates/commerce/database-billing/**"
      - "crates/supply/database-channel/**"
      - "crates/identity/database-user/**"
      # Identity owns the credential and identity facts. `service-token` carries the validation,
      # quota-settlement and rotation rules, and `service-user` the registration, login and JWT
      # rules; both use isolated temporary SQLite files, so they run without any service.
      - "crates/identity/service-token/**"
      - "crates/identity/service-user/**"
      - ".github/workflows/security-billing-invariants.yml"

permissions:
  contents: read

# Each invariant class reports on its own. Run steps stop at the first non-zero exit, so putting them
# in one job meant an early failure (the known-failing Node P0 compile) silently skipped the Billing
# and Security suites entirely -- those had no CI coverage at all for a long stretch. The jobs below
# are deliberately independent: only `formatting` gates the rest, and nothing depends on
# `node-invariants`, so a Node failure can no longer hide a Billing or Security verdict.
jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt on changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          mapfile -d '' rust_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" "$head_sha" -- '*.rs'
          )

          if [ "${#rust_files[@]}" -eq 0 ]; then
            echo "No changed Rust files to format-check."
            exit 0
          fi

          printf 'Checking rustfmt on %s changed Rust file(s):\n' "${#rust_files[@]}"
          printf '  %s\n' "${rust_files[@]}"
          rustfmt --edition 2021 --check --config skip_children=true "${rust_files[@]}"

  node-invariants:
    name: Node invariants
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check affected packages
        run: cargo check -p burncloud-router -p burncloud-server

      - name: Node runtime tests
        run: cargo test -p burncloud-node-runtime

      - name: Node P0 interrupted-preparation invariants
        run: cargo test -p burncloud-server --lib node_orchestrator::tests::interrupted_

      - name: Node black-box API tests
        run: cargo test -p burncloud-server --lib node_test

  billing-invariants:
    name: Billing invariants
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Billing invariants
        run: cargo test -p burncloud-router --test billing_invariants --test quota_tests

      - name: Commerce accounting tests
        run: cargo test -p burncloud-service-billing -p burncloud-database-billing

  security-invariants:
    name: Security invariants
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Security invariants
        run: cargo test -p burncloud-server --test security_invariants

  identity-invariants:
    name: Identity invariants
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Credential validation, quota settlement and rotation. The rules pinned here are the ones
      # that decide whether a revoked or exhausted credential can still spend, so they are worth a
      # job of their own rather than riding along with the contract tests.
      - name: Credential validation, quota and rotation
        shell: bash
        run: |
          # The suite is 18 tests. Asserting a floor means a renamed file, a lost `tests/`
          # directory or a typo in a filter fails here instead of passing over zero tests:
          # `cargo test` exits 0 when it runs nothing.
          set -o pipefail
          cargo test -p burncloud-service-token 2>&1 | tee /tmp/identity-token.log
          # awk rather than `grep | paste | bc`: bc is not installed in this environment and is not
          # guaranteed on the runner, so the pipeline would fail with "command not found" instead of
          # reporting the discovery problem it is meant to catch. Verified on a multi-line log and on
          # an empty one, where awk prints 0 rather than erroring.
          executed=$(awk '/^test result: ok\./ { for (i = 1; i <= NF; i++) if ($i == "ok.") { sum += $(i + 1) } } END { print sum + 0 }' /tmp/identity-token.log)
          echo "executed $executed test(s)"
          if [ "${executed:-0}" -lt 18 ]; then
            echo "::error::expected at least 18 tests in burncloud-service-token, found ${executed:-0}."
            echo "A zero count means the tests were not discovered; check that the package name"
            echo "and the tests/ directory still match."
            exit 1
          fi

      # Registration, login and JWT handling against isolated temporary databases. The isolation is
      # what makes this runnable in CI at all: before it, these tests opened the developer's real
      # database, which is neither present nor writable on a hosted runner.
      - name: Identity user rules against isolated databases
        shell: bash
        run: |
          # 11 in-crate tests plus 3 guards that assert the temporary-database helper is still
          # used and still cleans up. The guard count matters: if the helper is bypassed, the
          # suite would go back to writing into whatever database it can find.
          set -o pipefail
          cargo test -p burncloud-service-user 2>&1 | tee /tmp/identity-user.log
          executed=$(awk '/^test result: ok\./ { for (i = 1; i <= NF; i++) if ($i == "ok.") { sum += $(i + 1) } } END { print sum + 0 }' /tmp/identity-user.log)
          echo "executed $executed test(s)"
          if [ "${executed:-0}" -lt 14 ]; then
            echo "::error::expected at least 14 tests in burncloud-service-user, found ${executed:-0}."
            exit 1
          fi

  migration-contracts:
    name: Migration contracts
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The contract packages are the only definition of the domain types, and these tests pin the
      # encoding promises the migration had to preserve: enum discriminants, JSON field names,
      # serde defaults, and each contract's independence from infrastructure crates.
      - name: Contract golden tests and purity guards
        run: cargo test -p burncloud-commerce-contracts -p burncloud-supply-contracts -p burncloud-traffic-contracts

      # Guards that the migration cannot silently unwind: no domain type may be declared in the
      # Interfaces layer again, and its re-export surface must stay intact.
      - name: Interfaces surface guards
        run: cargo test -p burncloud-common

      # Persistence adapters exercised against real SQLite files through the production schema
      # initialisers, so a column or mapping regression fails here rather than in production.
      - name: Persistence adapters against real SQLite
        run: cargo test -p burncloud-database-channel -p burncloud-database-user
