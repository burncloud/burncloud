name: CI / Client

# MANUAL ONLY. The `pull_request` trigger is gone; local commits are gated by the pre-commit hook.
#
# This workflow owns client/default-feature coverage that the headless release gate cannot provide.
# `ci-quality.yml` intentionally uses `--no-default-features`; this file verifies UI conventions,
# LiveView and real desktop/default-feature configurations on supported platforms. It replaces the
# old `ci-tests.yml` default-feature escape hatch. Run it before a client release, and after changes
# to `crates/interfaces/client/**`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-conventions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/interfaces/client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check console button conventions
        run: bash scripts/check-ui-conventions.sh

      - name: Check functional console wiring
        run: bash scripts/check-functional-wiring.sh

      - name: Check product UX contracts
        run: bash scripts/check-product-ux.sh

      - name: Check visual system contracts
        run: bash scripts/check-visual-system.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check Dioxus LiveView client
        run: cargo check --no-default-features --features liveview

      - name: Check BurnCloud application integration
        run: cargo check -p burncloud

  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check Dioxus Windows desktop client
        run: cargo check -p burncloud-client

  macos-desktop:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check BurnCloud macOS desktop integration
        run: cargo check -p burncloud
