name: PR / Format Owned Files

on:
  push:
    branches:
      - chore/clippy-domain-root-baselines

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/clippy-domain-root-baselines
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit owned Rust files
        shell: bash
        run: |
          # Keep the source committed in the same format checked by code test.
          cargo fmt --all
          git add crates/identity/database-user/src/lib.rs \
                  crates/identity/service-user/src/lib.rs \
                  crates/traffic/database-router/src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format clippy cleanup sources"
          git push origin HEAD:chore/clippy-domain-root-baselines
