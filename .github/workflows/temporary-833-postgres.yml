name: Temporary / PostgreSQL #833 Verification

# One-time verification only; delete this workflow after collecting proof.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  postgres-833:
    if: github.event.pull_request.number == 834
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      BURNCLOUD_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: one-shot-833-pg
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev postgresql-client
      - name: Verify database
        run: pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - name: Verify fresh PostgreSQL schema and restart
        run: cargo test -p burncloud-database --test postgres_fresh_init --no-default-features -- --nocapture
      # Full Router log PostgreSQL decode checks are tracked independently by #835.
