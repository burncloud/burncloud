name: CI / Architecture

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'clippy.toml'
      - 'deny.toml'
      # This workflow's own name, which this branch changed. The previous name no longer exists in the
      # workflows directory, so keeping it would leave a filter that can never match.
      - '.github/workflows/ci-architecture.yml'
      # Added by `main` while this branch was open. Unrelated to the rename, and it would be lost by taking
      # this branch's side of the conflict.
      - '.github/hooks/**'
      - 'crates/**/Cargo.toml'
      - 'crates/**/*.rs'

permissions:
  contents: read

jobs:
  code-init:
    name: Code commands (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting used by local code test
        run: cargo fmt --all -- --check
      - name: Test initialization, affected-package selection and commit gates
        run: cargo test -p burncloud-code

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check workspace Clippy policy
        # The UI client's default `desktop` feature pulls GTK native libraries.
        # Linux architecture CI checks every target with defaults disabled; the
        # desktop feature remains the responsibility of platform-specific UI CI.
        run: cargo clippy --workspace --all-targets --no-default-features

  router-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check router service dependency whitelist
        run: ./crates/traffic/router/scripts/check-router-deps.sh --ci

  cargo-deny-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependency advisories, bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features
