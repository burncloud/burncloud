name: PR / Structured Guide

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要重新生成导读的 PR 编号
        required: true
        type: number
      force:
        description: 即使输入指纹未变化也重新调用模型
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-structured-guide-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  guide:
    name: Generate evidence-bound PR guide
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUTPUT_DIRECTORY: ${{ github.workspace }}/.pr-guide-output

    steps:
      # 仅通过 API 读取 PR 元数据。此步骤不检出或执行 PR head。
      - name: Resolve current PR and trusted base SHA
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const number = Number(process.env.REQUESTED_PR);
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error("PR number is missing or invalid.");
            }
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const pr = response.data;
            if (pr.state !== "open") {
              throw new Error(`PR #${number} is not open; generation stops after close.`);
            }
            if (!/^[0-9a-f]{40,64}$/i.test(pr.base.sha) ||
                !/^[0-9a-f]{40,64}$/i.test(pr.head.sha)) {
              throw new Error("GitHub returned an invalid base or head SHA.");
            }
            core.setOutput("number", String(number));
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);

      # pull_request_target 始终编译目标分支上的可信实现；禁止改为 PR head。
      - name: Checkout trusted base implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build trusted guide tool
        id: build
        continue-on-error: true
        run: cargo build --locked --release -p burncloud-code --bin pr_guide

      # 工具只读取 PR Git 对象、GitHub API 和模型 API；不会检出或执行 PR 代码。
      - name: Collect facts and generate reports
        id: analyze
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_GUIDE_API_KEY: ${{ secrets.PR_GUIDE_API_KEY }}
          PR_GUIDE_API_URL: ${{ vars.PR_GUIDE_API_URL }}
          PR_GUIDE_MODEL: ${{ vars.PR_GUIDE_MODEL }}
          PR_GUIDE_MAX_OUTPUT_TOKENS: ${{ vars.PR_GUIDE_MAX_OUTPUT_TOKENS || '5000' }}
          PR_GUIDE_RESPONSE_FORMAT: ${{ vars.PR_GUIDE_RESPONSE_FORMAT }}
          PR_GUIDE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          target/release/pr_guide analyze \
            --pr "${{ steps.pr.outputs.number }}" \
            --output "$OUTPUT_DIRECTORY"

      - name: Inspect generated state
        id: state
        if: steps.analyze.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIRECTORY/state.json"
          echo "reused=$(jq -r '.reused' "$OUTPUT_DIRECTORY/state.json")" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(jq -r '.artifact_name' "$OUTPUT_DIRECTORY/state.json")" >> "$GITHUB_OUTPUT"

      - name: Upload standalone HTML and machine facts
        id: artifact
        if: steps.analyze.outcome == 'success' && steps.state.outcome == 'success' && steps.state.outputs.reused != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.state.outputs.artifact_name }}
          path: ${{ env.OUTPUT_DIRECTORY }}
          if-no-files-found: error
          retention-days: 14

      # 发布前再次读取 GitHub 当前状态，防止旧任务覆盖新的 head。
      - name: Publish or update the single guide comment
        id: publish
        if: steps.analyze.outcome == 'success' && steps.state.outputs.reused != 'true' && steps.artifact.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target/release/pr_guide publish \
            --pr "${{ steps.pr.outputs.number }}" \
            --output "$OUTPUT_DIRECTORY"

      # 即使工具构建、采集或发布失败，也只更新固定评论，不批准、关闭或合并 PR。
      - name: Publish visible failure status
        if: always() && (steps.build.outcome != 'success' || steps.analyze.outcome == 'failure' || steps.state.outcome == 'failure' || steps.artifact.outcome == 'failure' || steps.publish.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const number = Number(process.env.PR_NUMBER);
            const pr = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            })).data;
            if (pr.state !== "open" || pr.head.sha !== process.env.EXPECTED_HEAD) {
              core.warning("PR closed or head changed; refusing to publish stale failure status.");
              return;
            }
            const marker = "<!-- burncloud-pr-guide:v1";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user &&
              comment.user.login === "github-actions[bot]" &&
              comment.body &&
              comment.body.includes(marker)
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const state = JSON.stringify({
              fingerprint: `failed-${context.runId}`,
              head_sha: pr.head.sha,
              status: "generation_failed",
            });
            const body = `${marker} ${state} -->\n## PR 结构化导读\n\n` +
              `报告生成失败。此状态对应 head \`${pr.head.sha.slice(0, 12)}\`。` +
              ` [查看工作流运行](${runUrl})。\n\n` +
              `- 工具构建：\`${process.env.BUILD_OUTCOME}\`\n` +
              `- 事实采集与渲染：\`${process.env.ANALYZE_OUTCOME}\`\n` +
              `- 状态检查：\`${process.env.STATE_OUTCOME}\`\n` +
              `- Artifact 上传：\`${process.env.ARTIFACT_OUTCOME}\`\n` +
              `- 评论发布：\`${process.env.PUBLISH_OUTCOME}\`\n\n` +
              `此失败不会批准、拒绝、关闭或合并 PR。`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }

      - name: Fail workflow after publishing failure status
        if: always() && (steps.build.outcome != 'success' || steps.analyze.outcome == 'failure' || steps.state.outcome == 'failure' || steps.artifact.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: exit 1
