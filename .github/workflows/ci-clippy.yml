name: CI / Clippy

# Keep one independent PR check per Rust quality gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci-base.yml
    with:
      check: clippy
      check_name: Cargo Clippy
