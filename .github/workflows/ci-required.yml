name: CI / Required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  fmt:
    name: Fmt
    uses: ./.github/workflows/ci-github-hosted-base.yml
    with:
      check: fmt
      check_name: Cargo Fmt

  test:
    name: Test
    uses: ./.github/workflows/ci-github-hosted-base.yml
    with:
      check: test
      check_name: Code Test

  clippy:
    name: Clippy
    uses: ./.github/workflows/ci-github-hosted-base.yml
    with:
      check: clippy
      check_name: Cargo Clippy

  deny:
    name: Deny
    uses: ./.github/workflows/ci-github-hosted-base.yml
    with:
      check: deny
      check_name: Cargo Deny

  required:
    name: CI Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [fmt, test, clippy, deny]
    steps:
      - name: Fail closed on any missing or failed required check
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          DENY_RESULT: ${{ needs.deny.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in FMT TEST CLIPPY DENY; do
            variable="${name}_RESULT"
            result="${!variable}"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name was '$result', expected success"
              failed=1
            fi
          done
          exit "$failed"
