name: Architecture Checks

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'clippy.toml'
      - 'deny.toml'
      - '.github/workflows/arch.yml'
      - '.github/hooks/**'
      - '.github/scripts/*code-init*'
      - '.github/scripts/pre-commit-checks.sh'
      - 'crates/**/Cargo.toml'
      - 'crates/**/*.rs'

permissions:
  contents: read

jobs:
  code-init:
    name: Code init hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Python for hook regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test local hook installation and commit gates
        run: python .github/scripts/test-code-init.py

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check workspace Clippy policy
        # The UI client's default `desktop` feature pulls GTK native libraries.
        # Linux architecture CI checks every target with defaults disabled; the
        # desktop feature remains the responsibility of platform-specific UI CI.
        run: cargo clippy --workspace --all-targets --no-default-features

  router-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check router service dependency whitelist
        run: ./crates/traffic/router/scripts/check-router-deps.sh --ci

  cargo-deny-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependency bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
          arguments: --all-features
