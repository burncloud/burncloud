name: CI / Tests

# MANUAL ONLY. This workflow no longer fires on `pull_request` or on a `push` to `main`. The same
# tests now run on the developer's machine: `.github/hooks/pre-commit` calls
# `cargo run --quiet -- code test --staged`, which selects the affected packages and runs their tests
# before the commit exists.
#
# What is left here is deliberately **not** a copy of that local selection. The local gate runs the
# packages a change touches; this runs the whole workspace on the exact commit you point it at, which
# is what a release needs and what a pre-commit hook cannot do cheaply. `ci-quality.yml` is the other
# half -- formatting, Clippy and `cargo deny` -- and is the one the release path calls.
#
# One difference from the gate, on purpose: `ci-quality.yml` uses `--no-default-features` because the
# client crate's default `desktop` feature needs GTK libraries that a headless runner does not have.
# That is right for a gate that must compile in one shot, but it means the default-feature
# configuration is never built by it. `default-features` below lets a run cover that configuration on
# a machine that has the native libraries, so the flag is a choice rather than a fixed policy.
#
# The five per-suite jobs this file used to hold (`node-invariants`, `billing-invariants`,
# `security-invariants`, `identity-invariants`, `migration-contracts`) are replaced by the single
# workspace run. They existed to keep one failure from hiding another while the suite was known to be
# red; now that it is green, running it whole is both simpler and the only way to notice a package
# that has stopped being tested at all. The identity discovery floors they carried are preserved as
# assertions below, and in `ci-quality.yml`.
on:
  workflow_dispatch:
    inputs:
      default-features:
        description: 'Build with default features (needs GTK; leave off for a headless runner)'
        type: boolean
        default: false

# Read-only: this workflow runs tests. It writes nothing to the repository.
permissions:
  contents: read

jobs:
  workspace-tests:
    name: cargo test (${{ inputs.default-features && 'default features' || 'no default features' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The suites below assert on credential and quota behaviour, so they need the same secrets the
      # local gate supplies. These are throwaway values for a test run, not production credentials.
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Roughly 90 seconds of the run is the build; the rest is the suite. One command for every
      # package rather than a hand-maintained list of `-p` flags: the list this replaces named
      # thirteen crates, so nineteen crates' tests -- including `burncloud-database`'s 86 -- were
      # executed by no job at all, and nothing failed to tell anyone.
      - name: cargo test --workspace
        shell: bash
        env:
          # Measured on a green run rather than guessed. `cargo test` exits 0 for a suite that ran
          # nothing, so without this floor a package removed from the workspace, a deleted `tests/`
          # directory or an empty filter would report as a pass. Update the number when tests are
          # added; see the "Known-failing checks" table in `.github/README.md`.
          MIN_EXECUTED_TESTS: "300"
          # The executable skip list is repository data, shared with `burncloud-code` and
          # `ci-quality.yml`. Every non-comment line must be test_name|issue_number|reason.
          KNOWN_TEST_BASELINE: ".github/test-plan/known-test-baseline.txt"
          DEFAULT_FEATURES: ${{ inputs.default-features }}
        run: |
          set -o pipefail

          FEATURES="--no-default-features"
          if [ "$DEFAULT_FEATURES" = "true" ]; then
            FEATURES=""
            echo "Running with default features: this needs GTK and will fail on a runner without it."
          fi

          SKIP_TESTS=$(awk -F'|' '/^[[:space:]]*[^#[:space:]]/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1 }' "$KNOWN_TEST_BASELINE" | xargs)
          skips=""
          for name in $SKIP_TESTS; do
            skips="$skips --skip $name"
          done

          # `--skip` is a libtest argument, not a cargo one: everything after `--` is forwarded to every
          # test binary cargo runs. Passing it before the `--` fails with
          # `unexpected argument '--skip' found`.
          #
          # shellcheck disable=SC2086 -- the split is intended: an empty FEATURES must add no argument,
          # and each --skip must be its own.
          cargo test --workspace $FEATURES -- $skips 2>&1 | tee /tmp/workspace-tests.log

          # awk rather than `grep | paste | bc`: bc is not installed on the runner, so a pipeline
          # through it would fail with "command not found" instead of reporting the discovery problem
          # it exists to catch. Sums the passed count across every `test result: ok.` line -- the
          # per-package unit, integration and doc summaries -- and prints 0 for an empty log.
          executed=$(awk '/^test result: ok\./ { for (i = 1; i <= NF; i++) if ($i == "ok.") { sum += $(i + 1) } } END { print sum + 0 }' /tmp/workspace-tests.log)
          echo "executed $executed test(s) across the workspace (skipped by name: ${SKIP_TESTS:-none})"
          if [ "${executed:-0}" -lt "${MIN_EXECUTED_TESTS}" ]; then
            echo "::error::expected at least ${MIN_EXECUTED_TESTS} tests across the workspace, found ${executed:-0}."
            echo "A zero count means the tests were not discovered at all; check that the workspace"
            echo "members in Cargo.toml and the tests/ directories still match."
            exit 1
          fi

      # The two packages that carry the credential, quota-settlement and rotation rules
      # (`service-token`) and the registration, login and JWT rules (`service-user`). Both isolate
      # themselves in temporary SQLite files, which is what makes them runnable here at all. These
      # floors were asserted by the `identity-invariants` job this workflow replaced, and they are
      # kept so the workspace-wide run does not lose the guard: `--workspace` going green does not
      # prove these suites were discovered.
      - name: Identity test discovery floors
        shell: bash
        run: |
          set -o pipefail

          # Floors measured on a green run, with a small margin: `service-token` currently reports 22
          # and `service-user` 14. The point is to catch a suite that was never discovered, not to
          # fail whenever a single test is removed.
          check_floor() {
            package="$1"; floor="$2"
            log="/tmp/discovery-$package.log"
            cargo test -p "$package" --no-default-features 2>&1 | tee "$log"
            executed=$(awk '/^test result: ok\./ { for (i = 1; i <= NF; i++) if ($i == "ok.") { sum += $(i + 1) } } END { print sum + 0 }' "$log")
            echo "$package executed $executed test(s)"
            if [ "${executed:-0}" -lt "$floor" ]; then
              echo "::error::expected at least $floor tests in $package, found ${executed:-0}."
              exit 1
            fi
          }

          check_floor burncloud-service-token 20
          check_floor burncloud-service-user 12

      - name: Upload the test log when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-log
          path: /tmp/workspace-tests.log
          if-no-files-found: ignore
