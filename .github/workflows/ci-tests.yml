name: CI / Tests

on:
  pull_request:
    paths:
      - "crates/interfaces/server/**"
      - "crates/traffic/router/**"
      - "crates/platform/node/**"
      - "crates/platform/storage/database/src/**"
      - "crates/traffic/database-router/**"
      - "crates/traffic/service-router-log/**"
      # Domain contracts and the Interfaces compatibility layer: these hold the type definitions
      # every other crate consumes, so a change here needs the contract tests to run.
      - "crates/commerce/contracts/**"
      - "crates/supply/contracts/**"
      - "crates/traffic/contracts/**"
      - "crates/interfaces/common/**"
      # Persistence adapters for Commerce and Supply, including their real-SQLite tests.
      - "crates/commerce/database-billing/**"
      - "crates/supply/database-channel/**"
      - "crates/identity/database-user/**"
      - ".github/workflows/ci-tests.yml"
  push:
    branches: [main]
    paths:
      - "crates/interfaces/server/**"
      - "crates/traffic/router/**"
      - "crates/platform/node/**"
      - "crates/platform/storage/database/src/**"
      - "crates/traffic/database-router/**"
      - "crates/traffic/service-router-log/**"
      - "crates/commerce/contracts/**"
      - "crates/supply/contracts/**"
      - "crates/traffic/contracts/**"
      - "crates/interfaces/common/**"
      - "crates/commerce/database-billing/**"
      - "crates/supply/database-channel/**"
      - "crates/identity/database-user/**"
      - ".github/workflows/ci-tests.yml"
  # Manual runs exist so that a change to this file can be validated on GitHub before it merges. A
  # `pull_request` run uses the workflow definition from the base branch, so a renamed or newly added
  # file is not parsed by the PR that introduces it -- measured on the rename PR, which reported no
  # checks at all. The steps are read-only (`permissions: contents: read`), so dispatching is safe.
  workflow_dispatch:

permissions:
  contents: read

# Each invariant class reports on its own. Run steps stop at the first non-zero exit, so putting them
# in one job meant an early failure (the known-failing Node P0 compile) silently skipped the Billing
# and Security suites entirely -- those had no CI coverage at all for a long stretch. The jobs below
# are deliberately independent: only `formatting` gates the rest, and nothing depends on
# `node-invariants`, so a Node failure can no longer hide a Billing or Security verdict.
jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt on changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          mapfile -d '' rust_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" "$head_sha" -- '*.rs'
          )

          if [ "${#rust_files[@]}" -eq 0 ]; then
            echo "No changed Rust files to format-check."
            exit 0
          fi

          printf 'Checking rustfmt on %s changed Rust file(s):\n' "${#rust_files[@]}"
          printf '  %s\n' "${rust_files[@]}"
          rustfmt --edition 2021 --check --config skip_children=true "${rust_files[@]}"

  node-invariants:
    name: Node invariants
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check affected packages
        run: cargo check -p burncloud-router -p burncloud-server

      - name: Node runtime tests
        run: cargo test -p burncloud-node-runtime

      - name: Node P0 interrupted-preparation invariants
        run: cargo test -p burncloud-server --lib node_orchestrator::tests::interrupted_

      - name: Node black-box API tests
        run: cargo test -p burncloud-server --lib node_test

  billing-invariants:
    name: Billing invariants
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Billing invariants
        run: cargo test -p burncloud-router --test billing_invariants --test quota_tests

      - name: Commerce accounting tests
        run: cargo test -p burncloud-service-billing -p burncloud-database-billing

  security-invariants:
    name: Security invariants
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: burncloud-ci-security-invariant-jwt-secret-2026
      BURNCLOUD_INTERNAL_SECRET: burncloud-ci-security-invariant-internal-secret
      MASTER_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      SKIP_INITIAL_PRICE_SYNC: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Security invariants
        run: cargo test -p burncloud-server --test security_invariants

  migration-contracts:
    name: Migration contracts
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The contract packages are the only definition of the domain types, and these tests pin the
      # encoding promises the migration had to preserve: enum discriminants, JSON field names,
      # serde defaults, and each contract's independence from infrastructure crates.
      - name: Contract golden tests and purity guards
        run: cargo test -p burncloud-commerce-contracts -p burncloud-supply-contracts -p burncloud-traffic-contracts

      # Guards that the migration cannot silently unwind: no domain type may be declared in the
      # Interfaces layer again, and its re-export surface must stay intact.
      - name: Interfaces surface guards
        run: cargo test -p burncloud-common

      # Persistence adapters exercised against real SQLite files through the production schema
      # initialisers, so a column or mapping regression fails here rather than in production.
      - name: Persistence adapters against real SQLite
        run: cargo test -p burncloud-database-channel -p burncloud-database-user
