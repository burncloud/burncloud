name: CI / Self-hosted Code Test

# Security model:
# - PRs from this repository authored by an allowlisted user run automatically.
# - Every other PR gets a real (failed) Code Test check instead of a skipped job.
# - A trusted maintainer can manually release that PR to the self-hosted runner by
#   submitting an APPROVE review. The approval creates a new Code Test run on the
#   same PR instead of trying to re-run an immutable skipped job.
#
# Access is decided entirely at **job level** (`RUN_CODE_TEST` and `runs-on` below), not by the trigger, so
# the `on:` block deliberately carries no branch filter — see the note there for why that matters.
#
# The workflow is driven from the base repository via pull_request_target/review,
# so an untrusted PR cannot edit this file to remove the gate before execution.
# No repository secrets are exposed and the GITHUB_TOKEN is read-only.
#
# SELF_HOSTED_CI_USERS is an optional repository variable containing a JSON array
# of trusted GitHub usernames, for example: ["rustburn","another-maintainer"].
# Until that variable is configured, rustburn is the only trusted user.
#
# Keep CI policy in BurnCloud code. A persistent self-hosted runner reuses its Rust
# installation. Only a truly empty runner gets a one-time minimal stable bootstrap.
# The quality gate itself runs through the dedicated `burncloud-code` binary so CI
# does not need to compile the full application merely to discover which checks to
# run. `code test` then performs `code init`, fmt, tests, Clippy and cargo-deny.

on:
  # No `branches:` filter: every PR gets a real Code Test check, whatever its base.
  #
  # The filter used to be `branches: [main]`, and two things followed from it — both wrong for a stack of PRs.
  # A PR based on a feature branch produced **no run at all** (not the "real (failed) Code Test check" the
  # policy above promises), and the job-level `base.ref == 'main'` conditions meant that even once a run
  # existed it was sent to `ubuntu-latest` to fail the manual-approval step rather than run the gate. So the
  # intermediate layers of a stack could not be verified until retargeted at `main`, which defeats the point of
  # splitting one change into layers.
  #
  # Removing both does not widen access: `RUN_CODE_TEST` still requires a **same-repository** PR from an
  # **allowlisted** author (or an APPROVE review by one), and `runs-on` still falls back to `ubuntu-latest` for
  # everything else — so an untrusted PR gets a failing check on a GitHub-hosted runner and never reaches the
  # self-hosted one. The base branch was never part of the trust decision.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # `pull_request_review` never had a branch filter, so only the job-level conditions applied to it.
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: self-hosted-code-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-test:
    name: Code Test
    env:
      RUN_CODE_TEST: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.SELF_HOSTED_CI_USERS || '["rustburn"]'), github.event.pull_request.user.login)) || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(fromJSON(vars.SELF_HOSTED_CI_USERS || '["rustburn"]'), github.event.review.user.login)) }}
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.SELF_HOSTED_CI_USERS || '["rustburn"]'), github.event.pull_request.user.login)) || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(fromJSON(vars.SELF_HOSTED_CI_USERS || '["rustburn"]'), github.event.review.user.login))) && '["self-hosted","linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 90

    steps:
      - name: Manual approval required
        if: env.RUN_CODE_TEST != 'true'
        shell: bash
        run: |
          echo "::error::Self-hosted Code Test requires manual approval for this PR."
          echo "A trusted maintainer must open the PR review UI and submit an APPROVE review."
          echo "That approval will trigger a fresh Code Test run for the current PR commit."
          exit 1

      - name: Checkout PR merge commit
        if: env.RUN_CODE_TEST == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Ensure base Rust toolchain
        if: env.RUN_CODE_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            echo "Rust is missing for the runner user; bootstrapping minimal stable once."
            if command -v rustup >/dev/null 2>&1; then
              rustup toolchain install stable --profile minimal --no-self-update
              rustup default stable
            else
              curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --fail --show-error --location https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
            fi
          fi

          cargo --version
          rustc --version

      - name: Run BurnCloud code gate
        if: env.RUN_CODE_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Debian/Ubuntu may have libssl-dev installed without the pkg-config
          # executable. Point openssl-sys at the installed headers/libs directly
          # so the gate itself does not require root access to the runner.
          if [[ -f /usr/include/openssl/ssl.h ]]; then
            export OPENSSL_INCLUDE_DIR=/usr/include
            ssl_lib="$(ldconfig -p 2>/dev/null | awk '/libssl\.so/{print $NF; exit}')"
            if [[ -n "$ssl_lib" ]]; then
              export OPENSSL_LIB_DIR="$(dirname "$ssl_lib")"
            fi
          fi

          # Only the changed packages and their transitive workspace consumers are checked.
          #
          # `code test` owns the analysis — it resolves the merge base itself (`git merge-base <ref> HEAD`) and
          # selects from there — so the workflow only has to name the comparison point. No branch-resolution or
          # fallback logic belongs here; if the reference cannot be resolved, that is `code test`'s error to
          # report, not something for the workflow to paper over.
          #
          # `--all` was used before, because without a base a CI checkout has nothing to diff against
          # (`Changed paths (0)`), so the whole workspace was the only answer available. Naming the base makes
          # the change set computable here: a one-file test fix goes from 34 packages to 10.
          #
          # The base branch is fetched by `actions/checkout`'s refspec (`+refs/heads/*:refs/remotes/origin/*`).
          # `github.base_ref` is defined for `pull_request_target`, which is the only event this job runs the
          # gate for.
          cargo run -p burncloud-code -- test --base "origin/${{ github.base_ref }}"
