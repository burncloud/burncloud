name: CI / GitHub-hosted Test

# Keep one independent PR check per Rust quality gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci-self-hosted-base.yml
    with:
      check: test
      check_name: Code Test
