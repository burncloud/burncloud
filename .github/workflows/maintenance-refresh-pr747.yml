name: Maintenance / Refresh PR 747

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/maintenance-refresh-pr747.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh PR 747 onto current main
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge current main and resolve the known PR 747 overlaps
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/675-and-667-cache-and-counter'
          git config user.name 'BurnCloud CI'
          git config user.email 'ci@burncloud.invalid'
          git fetch origin main "$branch"
          old_head="$(git rev-parse "origin/$branch")"
          main_head="$(git rev-parse origin/main)"
          echo "old PR head: $old_head"
          echo "main head:   $main_head"

          git checkout -B refresh-pr747 "$old_head"
          set +e
          git merge --no-commit --no-ff "$main_head"
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          echo 'Conflicts detected:'
          printf '%s\n' "$conflicts"

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              crates/commerce/service-billing/src/calculator.rs|\
              crates/commerce/service-billing/src/counter.rs|\
              crates/supply/service-models/src/lib.rs|\
              crates/traffic/database-router/tests/cost_roundtrip.rs|\
              crates/traffic/router/src/circuit_breaker.rs|\
              crates/traffic/router/src/lib.rs|\
              crates/traffic/router/src/rate_budget.rs)
                ;;
              *)
                echo "Unexpected conflict outside audited PR 747 overlap: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$conflicts"

          resolve_if_conflict() {
            local side="$1" file="$2"
            if git ls-files -u -- "$file" | grep -q .; then
              git checkout "--$side" -- "$file"
            fi
          }

          # These three files contain the substantive PR implementation. Main only
          # added test-lint metadata in their overlapping regions, so retain PR 747
          # and add that metadata below.
          resolve_if_conflict ours crates/commerce/service-billing/src/calculator.rs
          resolve_if_conflict ours crates/commerce/service-billing/src/counter.rs
          resolve_if_conflict ours crates/traffic/router/src/rate_budget.rs

          # These files have larger, newer main-side changes. Preserve main and
          # replay only PR 747's audited business deltas below.
          resolve_if_conflict theirs crates/traffic/database-router/tests/cost_roundtrip.rs
          resolve_if_conflict theirs crates/traffic/router/src/circuit_breaker.rs
          resolve_if_conflict theirs crates/traffic/router/src/lib.rs

          # Main already contains the same rustfmt module-order change.
          resolve_if_conflict theirs crates/supply/service-models/src/lib.rs

          python3 <<'PY'
          from pathlib import Path

          def replace_or_verify(path, old, new, marker=None, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found:
                  if found != count:
                      raise SystemExit(f"{path}: expected {count} old occurrence(s), found {found}")
                  text = text.replace(old, new, count)
                  p.write_text(text)
                  return
              marker = new if marker is None else marker
              if marker not in text:
                  raise SystemExit(f"{path}: neither old text nor resolved marker found")

          # Preserve the stricter test-lint metadata already on main.
          replace_or_verify(
              'crates/commerce/service-billing/src/calculator.rs',
              '#[allow(clippy::unwrap_used, clippy::expect_used)]',
              '#[allow(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    reason = "unit-test module: unwrap/expect failures are the intended failure signal"\n)]',
              'reason = "unit-test module: unwrap/expect failures are the intended failure signal"',
          )
          replace_or_verify(
              'crates/commerce/service-billing/src/counter.rs',
              '#[allow(clippy::unwrap_used, clippy::expect_used)]',
              '#[allow(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    reason = "unit-test module: unwrap/expect failures are the intended failure signal"\n)]',
              'reason = "unit-test module: unwrap/expect failures are the intended failure signal"',
          )
          replace_or_verify(
              'crates/traffic/router/src/rate_budget.rs',
              '#[allow(clippy::unwrap_used)]',
              '#[allow(\n    clippy::unwrap_used,\n    reason = "unit-test module: the fixtures cannot fail, so an unwrap failure is the intended failure signal"\n)]',
              'reason = "unit-test module: the fixtures cannot fail, so an unwrap failure is the intended failure signal"',
          )

          # #618: keep main's newer test fixture lifecycle while restoring the
          # cache-write regression oracle.
          cost = Path('crates/traffic/database-router/tests/cost_roundtrip.rs')
          text = cost.read_text()
          old_comment = '''/// FM-10 (partial): cache_write_cost is currently always 0 (known limitation, P1 backlog)\n///   - We assert cache_write_cost == 0 explicitly so a future fix is visible in test output.'''
          new_comment = '''/// FM-10 (fixed in #618): the router used to write `cache_read_cost = cache_cost`\n///   (read + write merged) and `cache_write_cost = 0`, so cache-write spend was\n///   invisible in every per-column report. The breakdown now carries the two split\n///   and each column round-trips its own value.'''
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)
          elif new_comment not in text:
              raise SystemExit('cost_roundtrip: FM-10 comment shape changed unexpectedly')
          old = 'cache_write_cost: 0, // FM-10: currently always 0 (merged into cache_read_cost above)'
          new = 'cache_write_cost: 1_250_000, // #618: written to its own column, not merged into read'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('cost_roundtrip: cache_write fixture shape changed unexpectedly')
          old = '''        row.cache_write_cost, 0,\n        "cache_write_cost (FM-10: expected 0 until P1 split)"'''
          new = '''        row.cache_write_cost, log.cache_write_cost,\n        "cache_write_cost (the split #618 restored: a non-zero write cost must survive)"'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'row.cache_write_cost, log.cache_write_cost' not in text:
              raise SystemExit('cost_roundtrip: cache_write assertion shape changed unexpectedly')
          cost.write_text(text)

          # Keep main's rewritten circuit-breaker implementation and only restore
          # PR 747's non-panicking JoinHandle collection.
          circuit = Path('crates/traffic/router/src/circuit_breaker.rs')
          text = circuit.read_text()
          old_main = '.map(|handle| handle.join().unwrap_or(false))\n            .filter(|admitted| *admitted)'
          old_pr_base = '.filter(|handle| handle.join().unwrap_or(false))'
          new = '.filter_map(|handle| handle.join().ok())\n            .filter(|admitted| *admitted)'
          if old_main in text:
              text = text.replace(old_main, new, 1)
          elif old_pr_base in text:
              text = text.replace(old_pr_base, new, 1)
          elif new not in text:
              raise SystemExit('circuit_breaker: half-open join collection shape changed unexpectedly')
          circuit.write_text(text)

          # Keep main's large router evolution and replay the four #747 call-site
          # changes required by #618/#675/#667.
          router = Path('crates/traffic/router/src/lib.rs')
          text = router.read_text()
          old = '''        // TODO: promote cache_read_cost/cache_write_cost to separate CostBreakdown fields\n        // (calculator.rs already computes them separately before merging; see compute_breakdown)\n        cache_read_cost: cost_breakdown.cache_cost, // currently stores read+write merged\n        cache_write_cost: 0,'''
          new = '''        // #618: the calculator splits read from write; write each to its own\n        // column so cache-write spend is not reported as 0 / merged into read.\n        cache_read_cost: cost_breakdown.cache_read_cost,\n        cache_write_cost: cost_breakdown.cache_write_cost,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'cache_read_cost: cost_breakdown.cache_read_cost' not in text:
              raise SystemExit('router lib: cache cost logging shape changed unexpectedly')

          old = '''            budget_guard = Some(BudgetGuard::new(\n                state.rate_budget.as_ref(),\n                channel_id_i32,\n                shaper_ctx.color,\n                shaper_ctx.est_tpm,\n            ));'''
          new = '''            budget_guard = outcome.sourced().map(|source| {\n                BudgetGuard::with_source(\n                    state.rate_budget.as_ref(),\n                    channel_id_i32,\n                    shaper_ctx.color,\n                    shaper_ctx.est_tpm,\n                    source,\n                )\n            });'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'BudgetGuard::with_source(' not in text:
              raise SystemExit('router lib: budget guard call-site shape changed unexpectedly')

          old_count = text.count('"anthropic" => counter_clone.accumulate(&u),')
          if old_count:
              if old_count != 2:
                  raise SystemExit(f'router lib: expected 2 Anthropic cumulative call sites, found {old_count}')
              text = text.replace(
                  '"anthropic" => counter_clone.accumulate(&u),',
                  '"anthropic" => counter_clone.record_cumulative(&u),',
              )
          elif text.count('"anthropic" => counter_clone.record_cumulative(&u),') < 2:
              raise SystemExit('router lib: Anthropic streaming call sites changed unexpectedly')
          router.write_text(text)
          PY

          git add \
            crates/commerce/service-billing/src/calculator.rs \
            crates/commerce/service-billing/src/counter.rs \
            crates/supply/service-models/src/lib.rs \
            crates/traffic/database-router/tests/cost_roundtrip.rs \
            crates/traffic/router/src/circuit_breaker.rs \
            crates/traffic/router/src/lib.rs \
            crates/traffic/router/src/rate_budget.rs

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'Unresolved conflicts remain:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git diff --cached --check
          git status --short
          git commit -m 'Merge latest main into #747 and resolve audited overlaps'
          git push origin HEAD:"$branch"
