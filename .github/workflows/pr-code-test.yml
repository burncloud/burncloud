name: PR Domain Roots / Strict Clippy

on:
  push:
    branches:
      - chore/clippy-domain-root-baselines

permissions:
  contents: read

jobs:
  domain-roots-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/clippy-domain-root-baselines
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Strict Clippy
        run: cargo clippy -p burncloud-database-user -p burncloud-service-user -p burncloud-database-router --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test -p burncloud-database-user -p burncloud-service-user -p burncloud-database-router --no-default-features
