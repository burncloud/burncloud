name: PR Router / Strict Clippy

on:
  push:
    branches:
      - chore/clippy-router-baseline

permissions:
  contents: read

jobs:
  router-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/clippy-router-baseline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Strict Clippy
        run: cargo clippy -p burncloud-router --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test -p burncloud-router --no-default-features
