name: Maintenance / Modernize Claude Fixture

on:
  push:
    branches:
      - fix/675-and-667-cache-and-counter
    paths:
      - .github/workflows/maintenance-modernize-claude-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/675-and-667-cache-and-counter
          fetch-depth: 0

      - name: Migrate only the stale Claude adaptor fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BurnCloud CI'
          git config user.email 'ci@burncloud.invalid'

          python3 <<'PY'
          from pathlib import Path

          path = Path('crates/traffic/router/tests/adaptor_tests.rs')
          text = path.read_text()

          old = 'use common::{setup_db, start_test_server};'
          new = 'use common::{ensure_channel_tables, setup_db, start_test_server};'
          if old not in text:
              raise SystemExit('expected common import not found')
          text = text.replace(old, new, 1)

          old_response = '''                    serde_json::json!({
                        "content": [ { "text": "Mock Claude Response" } ]
                    })
                    .to_string()'''
          new_response = '''                    serde_json::json!({
                        "id": "msg_mock",
                        "type": "message",
                        "role": "assistant",
                        "content": [{ "type": "text", "text": "Mock Claude Response" }],
                        "model": "claude-3-opus",
                        "stop_reason": "end_turn",
                        "usage": { "input_tokens": 12, "output_tokens": 8 }
                    })
                    .to_string()'''
          if old_response not in text:
              raise SystemExit('expected Claude mock response not found')
          text = text.replace(old_response, new_response, 1)

          old_fixture = '''    let id = "claude-adaptor-test";
    let name = "claude-3-opus";
    let base_url = format!("http://localhost:{}", mock_port);
    let match_path = "/anything";
    let auth_type = "Claude";
    let api_key = "sk-ant-mock-key";

    sqlx::query(
        r#"
        INSERT INTO router_upstreams (id, name, base_url, api_key, match_path, auth_type, protocol)
        VALUES (?, ?, ?, ?, ?, ?, ?)
        ON CONFLICT(id) DO UPDATE SET 
            api_key = excluded.api_key,
            base_url = excluded.base_url,
            auth_type = excluded.auth_type,
            protocol = excluded.protocol
        "#,
    )
    .bind(id)
    .bind(name)
    .bind(base_url)
    .bind(api_key)
    .bind(match_path)
    .bind(auth_type)
    .bind("claude") // Force protocol to claude
    .execute(&pool)
    .await?;'''
          new_fixture = '''    let channel_id = 14_i32;
    let name = "claude-3-opus";
    let base_url = format!("http://localhost:{}", mock_port);
    let api_key = "sk-ant-mock-key";

    // The production router no longer reads router_upstreams. Register an
    // Anthropic provider and a matching model ability through the current
    // channel tables so this integration test exercises the real route.
    ensure_channel_tables(&pool).await?;
    sqlx::query(
        r#"
        INSERT OR REPLACE INTO channel_providers
        (id, type, key, status, name, weight, base_url, models, `group`, priority)
        VALUES (?, 14, ?, 1, ?, 1, ?, ?, 'default', 0)
        "#,
    )
    .bind(channel_id)
    .bind(api_key)
    .bind(name)
    .bind(&base_url)
    .bind(name)
    .execute(&pool)
    .await?;
    sqlx::query(
        r#"
        INSERT OR REPLACE INTO channel_abilities (`group`, model, channel_id, enabled, priority, weight)
        VALUES ('default', ?, ?, 1, 0, 1)
        "#,
    )
    .bind(name)
    .bind(channel_id)
    .execute(&pool)
    .await?;'''
          if old_fixture not in text:
              raise SystemExit('expected legacy Claude router_upstreams fixture not found')
          text = text.replace(old_fixture, new_fixture, 1)

          path.write_text(text)
          PY

          git rm .github/workflows/maintenance-modernize-claude-fixture.yml
          git add crates/traffic/router/tests/adaptor_tests.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(router-test): route Claude adaptor through channel tables'
          git push origin HEAD:fix/675-and-667-cache-and-counter
