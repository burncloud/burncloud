name: One-shot repair PR 748

on:
  push:
    branches:
      - fix/606-pricing-layout-dispatch

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/606-pricing-layout-dispatch
          fetch-depth: 0

      - name: Repair layout detection and add regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mod = Path('crates/commerce/contracts/src/pricing/mod.rs')
          s = mod.read_text()
          old = 'const V1_ONLY_KEYS: [&str; 3] = ["pricing", "cache_pricing", "batch_pricing"];'
          new = '''const V1_ONLY_KEYS: [&str; 8] = [
              "pricing",
              "tiered_pricing",
              "cache_pricing",
              "batch_pricing",
              "voices_pricing",
              "video_pricing",
              "asr_pricing",
              "realtime_pricing",
          ];'''
          if old not in s:
              raise SystemExit('V1 marker anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '/// Only the discriminator keys are inspected — a `pricing` key names the\n/// normalised form, and `text` / the other modality keys name the flat form — so\n',
              '/// Only discriminator keys are inspected. Any field unique to `ModelPricing`\n/// pricing blocks (`pricing`, `tiered_pricing`, cache/batch/media pricing) names the\n/// normalised form, while `text` / the other modality keys name the flat form — so\n',
              1,
          )
          s = s.replace(
              '#[allow(clippy::disallowed_types)] // Value is the intermediate parse step for layout sniffing only\nfn detect_model_layout',
              'fn detect_model_layout',
              1,
          )
          s = s.replace(
              '    #[allow(clippy::disallowed_types)] // Value is an intermediate parse step for version sniffing only\n    pub fn from_json',
              '    pub fn from_json',
              1,
          )
          mod.write_text(s)

          tests = Path('crates/commerce/contracts/tests/version_and_tiers.rs')
          t = tests.read_text()
          marker = 'fn layout_detection_recognises_v1_specialised_price_blocks_without_standard_pricing()'
          if marker not in t:
              t += r'''

#[test]
fn layout_detection_recognises_v1_specialised_price_blocks_without_standard_pricing() {
    // A hand-written or historical normalised document is allowed to omit the
    // standard `pricing` field because it has `#[serde(default)]`. The layout
    // detector therefore must recognise the specialised v1-only fields too;
    // otherwise version "7.0" would send a valid v1 body to the flat-v7 parser.
    let tiered_only = r#"{
        "version":"7.0",
        "updated_at":"2026-03-29T00:00:00Z",
        "source":"test",
        "models":{
            "m":{
                "tiered_pricing":{
                    "USD":[{"tier_start":0,"tier_end":1000,"input_price":3.0,"output_price":4.0}]
                }
            }
        }
    }"#;
    let tiered = PricingConfig::from_json(tiered_only)
        .unwrap_or_else(|e| panic!("tiered-only v1 layout must parse: {e}"));
    assert_eq!(
        tiered
            .get_tiered_pricing("m", "USD")
            .expect("tiered price survives")[0]
            .input_price,
        THREE_USD
    );

    let video_only = r#"{
        "version":"7.0",
        "updated_at":"2026-03-29T00:00:00Z",
        "source":"test",
        "models":{
            "video-model":{
                "video_pricing":{
                    "USD":{"1080p":0.10}
                }
            }
        }
    }"#;
    let video = PricingConfig::from_json(video_only)
        .unwrap_or_else(|e| panic!("video-only v1 layout must parse: {e}"));
    assert!(
        video.models["video-model"].video_pricing.is_some(),
        "specialised media pricing is a v1 layout marker even when `pricing` is omitted"
    );
}
'''
              tests.write_text(t)
          PY

          cargo fmt --all

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-pr748.yml
          git add crates/commerce/contracts/src/pricing/mod.rs crates/commerce/contracts/tests/version_and_tiers.rs
          git commit -m "fix(pricing): recognise all normalised v1 layout markers"
          git push origin HEAD:fix/606-pricing-layout-dispatch
