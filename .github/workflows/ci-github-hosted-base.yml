name: Reusable / GitHub-hosted Rust Check

on:
  workflow_call:
    inputs:
      check:
        description: One of fmt, test, clippy, deny.
        required: true
        type: string
      check_name:
        description: Human-readable GitHub check name.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-hosted-${{ inputs.check }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.check_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Validate requested check
        env:
          REQUESTED_CHECK: ${{ inputs.check }}
        run: |
          case "$REQUESTED_CHECK" in
            fmt|test|clippy|deny) ;;
            *) echo "::error::Unsupported Rust check: $REQUESTED_CHECK"; exit 2 ;;
          esac

      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect dependency-policy changes
        id: deny_scope
        if: inputs.check == 'deny'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          merge_base="$(git merge-base "$base" HEAD)"
          run_deny=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              Cargo.toml|*/Cargo.toml|Cargo.lock|deny.toml|.cargo/*)
                echo "Dependency-policy change: $path"
                run_deny=true
                ;;
            esac
          done < <(git diff --name-only "$merge_base" HEAD --)
          echo "run=$run_deny" >> "$GITHUB_OUTPUT"
          if [[ "$run_deny" == "false" ]]; then
            echo "No dependency-policy changes; skipping Cargo Deny."
          fi

      - name: Cache Cargo downloads and build outputs
        if: inputs.check != 'deny' || steps.deny_scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: github-hosted-${{ inputs.check }}
          cache-on-failure: false

      - name: Ensure Rust components
        if: inputs.check != 'deny' || steps.deny_scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo --version
          rustc --version

      - name: Prepare OpenSSL dependencies
        if: inputs.check == 'test' || inputs.check == 'clippy'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # Architectural rename regression guard: scan the entire tracked tree rather
      # than trusting GitHub code-search indexing (which may still show main).
      # The migration record and the code test's before/after fixture are historical,
      # not active Cargo or Rust references.
      - name: Audit retired Identity Token package references
        if: inputs.check == 'fmt'
        shell: bash
        run: |
          set -euo pipefail
          old_package="burncloud-""service-token"
          old_module="burncloud_""service_token"
          old_path="crates/identity/""service-token"
          set +e
          git grep -n -F -e "$old_package" -e "$old_module" -e "$old_path" -- . \
            ':!docs/architecture/arch-mig-828-phase-f1.md' \
            ':!crates/platform/code/src/manifest.rs'
          status=$?
          set -e
          case "$status" in
            0) echo "::error::Found references to the retired Identity Token crate outside historical fixtures"; exit 1 ;;
            1) echo "Retired Identity Token reference audit: PASS (all tracked files scanned)" ;;
            *) echo "::error::git grep could not complete the repository scan"; exit "$status" ;;
          esac

      - name: Cargo Fmt
        if: inputs.check == 'fmt'
        run: cargo fmt --all -- --check

      - name: Code Test
        if: inputs.check == 'test'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: cargo run -p burncloud-code -- test --base "origin/$BASE_REF"

      - name: Cargo Clippy
        if: inputs.check == 'clippy'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: cargo run -p burncloud-code -- clippy --base "origin/$BASE_REF"

      - name: Ensure cargo-deny
        if: inputs.check == 'deny' && steps.deny_scope.outputs.run == 'true'
        run: |
          cargo deny --version >/dev/null 2>&1 || cargo install --locked cargo-deny

      - name: Cargo Deny
        if: inputs.check == 'deny' && steps.deny_scope.outputs.run == 'true'
        run: |
          set +e
          timeout --kill-after=30s 5m cargo deny --log-level info check
          status=$?
          set -e
          if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
            echo "::error::Cargo Deny exceeded the 5 minute limit."
          fi
          exit "$status"
